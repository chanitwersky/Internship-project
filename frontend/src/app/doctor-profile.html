<div class="page-container">
  <h1 class="page-title">פרופיל רופא</h1>
  <p class="page-subtitle">עדכן את השם וההתמחות שלך כפי שיוצגו למטופלים במערכת.</p>

  @if (error) {
    <div class="banner error-banner">{{ error }}</div>
  }

  @if (loading) {
    <div class="loading-row">
      <mat-spinner diameter="32"></mat-spinner>
      <span>טוען פרופיל...</span>
    </div>
  } @else {
    <mat-card appearance="outlined" class="profile-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>badge</mat-icon>
        <mat-card-title>פרטי רופא</mat-card-title>
        <mat-card-subtitle>מזהה: {{ doctorId }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>שם מלא</mat-label>
          <input matInput type="text" [(ngModel)]="name" placeholder="לדוגמה: משה רופא" />
          <mat-icon matPrefix>person</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>התמחות</mat-label>
          <input matInput type="text" [(ngModel)]="specialty" placeholder="לדוגמה: רפואת משפחה" />
          <mat-icon matPrefix>medical_services</mat-icon>
        </mat-form-field>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-button type="button" routerLink="/doctor">חזרה ללוח הבקרה</button>
        <button mat-flat-button color="primary" type="button" [disabled]="saving" (click)="saveProfile()">
          {{ saving ? 'שומר...' : 'שמור שינויים' }}
        </button>
      </mat-card-actions>
    </mat-card>
  }
</div>
