<div class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-icon mat-card-avatar class="login-avatar">person</mat-icon>
      <mat-card-title>התחברות למערכת</mat-card-title>
      <mat-card-subtitle>הזן את מספר תעודת הזהות שלך</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>מספר זהות</mat-label>
          <input matInput type="text" formControlName="id" autocomplete="username" />
          <mat-icon matPrefix>badge</mat-icon>
          @if (loginForm.get('id')?.invalid && loginForm.get('id')?.touched) {
            <mat-error>יש להזין מספר זהות</mat-error>
          }
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="login-button">
          <mat-icon>login</mat-icon>
          התחבר
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="login-hint">
      <mat-icon>info</mat-icon>
      <span>מטופל לדוגמה: 123456789 | רופא לדוגמה: 000000001</span>
    </mat-card-footer>
  </mat-card>
</div>
